services:
  - type: web
    name: modern-art-club
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/modern-art
    disk:
      name: modern-art-state
      mountPath: /var/data
      sizeGB: 1
